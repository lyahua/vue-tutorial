<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin:0
        }
        .box1{
            width:100px;
            height:100px;
            position: relative;
        }
        .box2{
            width:50px;
            height: 50px;
            margin:0 auto;

        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="box2"></div>
    </div>

    <script>
        // console.log()
        let dom = document.querySelector('.box2');
        console.log(dom.offsetWidth)
        console.log(dom.offsetHeight)
        console.log(dom.offsetLeft)
        console.log(dom.offsetTop)
        console.log(dom.offsetParent)
    </script>
</body>
</html>
