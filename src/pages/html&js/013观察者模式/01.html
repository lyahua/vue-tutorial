<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        *观察者模式包住观察目标和观察者两类对象
         一个目标可以有任意数目的与之相依赖的观察者
         一旦观察目标的状态发生改变，所有的观察都都将得到通知

         当一个对象的状态发生改变时，所有依赖于它的对象都得到通知并被自动更新，解决了主体对象与观察者之间功能的耦合，即一个对象状态改变给其他对象通知的问题
        */

        // 被观察的目标
        class Subscriber{
            constructor(){
                this.Observers=[]; 
            }

            // 加入观察者
            add(name){
                this.Observers.push(name)
            }

            // 移除观察者
            remove(observer){
                this.Observers = this.Observers.fiter(x=>x!==observer)
            }

            // 通知观察者
            notify(){
                this.Observers.forEach((item)=>{
                    console.log(item)
                    item.update();
                })
            }
        }

        // 观察者
        class Observer{
            // 加个名字加以区分观察者
            constructor(name){
                this.name = name;
            }

            update(){
                console.log('update'+this.name)
            }
        }


        const subject = new Subscriber();
        const observer1 = new Observer('1');
        const observer2 = new Observer('2');

        subject.add(observer1);
        subject.add(observer2)
    </script>
</body>
</html>
