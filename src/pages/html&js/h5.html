"<!DOCTYPE html>\n" +
            "<html lang=\"en\">\n" +
            "  <head>\n" +
            "    <meta charset=\"UTF-8\" />\n" +
            "    <title>H5</title>\n" +
            "    <style>\n" +
            "      html {\n" +
            "        width: 100%;\n" +
            "        height: 100%;\n" +
            "      }\n" +
            "      /* CSS样式 */\n" +
            "      body {\n" +
            "        width: 100%;\n" +
            "        height: 100%;\n" +
            "        font-family: Arial, sans-serif;\n" +
            "        background-color: #f2f2f2;\n" +
            "      }\n" +
            "      a {\n" +
            "        text-decoration: none; /* 移除链接默认的下划线 */\n" +
            "      }\n" +
            "      .h5-content {\n" +
            "        width: 100%;\n" +
            "        height: 100%;\n" +
            "      }\n" +
            "      .h5-float {\n" +
            "        width: 100%
            "        height: 100%;\n" +
            "        overflow-y: auto;\n" +
            "        position: relative;\n" +
            "      }\n" +
            "      .h5-img {\n" +
            "        width: 100%;\n" +
            "      }\n" +
            "      .h5-btn {\n" +
            "        position: absolute;\n" +
            "        cursor: pointer;\n" +
            "        text-align: center;\n" +
            "        display: flex;\n" +
            "        justify-content: center;\n" +
            "        align-items: center;\n" +
            "      }\n" +
            "    </style>\n" +
            "  </head>\n" +
            "  <body>\n" +
                "    <div class=\"h5-content\">\n" +
            "      <div class=\"h5-float\">\n" +
            "        <img\n" +
            "          id=\"h5Image\"\n" +
            "          class=\"h5-img\"\n" +
            "          src=\"${imageUrl}\"\n" +
            "          onload=\"getImageSize(this)\"\n" +
            "        />\n" +
            "        <div id=\"h5Btn\" class=\"h5-btn\">\n" +
            "          <a href=\"${targetLink}\">${btnName}</a>\n" +
            "        </div>\n" +
            "      </div>\n" +
            "    </div>\n" +
            "  </body>\n" +
            "  <script>\n" +
            "    function getImageSize(img) {\n" +
            "      var width = img.naturalWidth;\n" +
            "      var height = img.naturalHeight;\n" +
            "      console.log(img, \"Width: \" + width + \", Height: \" + height);\n" +
            "    }\n" +
            "    function renderBtnStyle(btn) {\n" +
            "      if (btnSet === \"02\") return;\n" +
            "      var btn = document.getElementById(\"h5Btn\");\n" +
            "      btn.setAttribute(\"style\", btnStyle);\n" +
            "    }\n" +
            "    var btnFloatType = `${btnFloatType}`;\n" +
            "    var btnSet = `${btnSet}`;\n" +
            "    var btnW = `${btnWidth}`;\n" +
            "    var btnH = `${btnHeight}`;\n" +
            "    var btnPosition = JSON.parse(`${btnPosition}`);\n" +
            "    var btnLeft = btnPosition[0];\n" +
            "    var btnRight = btnPosition[1];\n" +
            "    var btnStyle = `${btnStyle};width:${btnW}px;height:${btnH}px;`;\n" +
            "    renderBtnStyle();\n" +
            "  </script>\n" +
            "</html>"
