<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var students = [
            {
                name:'张三',
                age: 18
            },
            {
                name: '李四',
                age: 19
            },
            {
                name: '王五',
                age: 20
            }
        ]

        function filter(arr, callback){
            var result = [];

            for(var i=0; i<arr.length; i++) {
                // 函数调用的时候传入参数
                if(callback(arr[i])) {
                    result.push(arr[i])
                }

            }
            return result
        }

        filter(students, function(s){
            return s.age === 19
        })
    </script>
</body>
</html>
